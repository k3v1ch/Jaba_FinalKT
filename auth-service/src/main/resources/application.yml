server:
  port: 8080
  tomcat:
    threads:
      max: 20   # default is 200 — far more threads (and stack memory) than this load needs

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5      # default is 10; this app's load needs far fewer
      minimum-idle: 1           # don't keep idle connections occupying RAM
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLE:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  frontend-url: ${FRONTEND_URL:http://localhost:8000}
  admin:
    security-code: ${APP_ADMIN_SECURITY_CODE}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@event.com}
    # No default on purpose: without an explicit password the admin is not seeded.
    admin-password: ${SEED_ADMIN_PASSWORD:}
    admin-name: ${SEED_ADMIN_NAME:Admin}
  uploads:
    profile-images-dir: ${UPLOADS_DIR:./uploads/profile-images}
    max-images-per-user: 5
