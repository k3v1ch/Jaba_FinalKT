services:
  # ─── Databases ──────────────────────────────────────────────
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    # No host port: DB is reachable only on the internal docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  event-db:
    image: postgres:16-alpine
    container_name: event-db
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - event-db-data:/var/lib/postgresql/data
    # No host port: DB is reachable only on the internal docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Message broker ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    mem_limit: 384m
    cpus: 0.75
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    # No host port: broker + management UI stay on the internal docker network.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Microservices ──────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    mem_limit: 384m
    cpus: 1.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-bXktc3VwZXItc2VjcmV0LWtleS1mb3ItZXZlbnQtcGxhdGZvcm0tMjAyNQ==}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_ADMIN_SECURITY_CODE: ${ADMIN_SECURITY_CODE:-admin-secure-2025}
      UPLOADS_DIR: /app/uploads/profile-images
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-false}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
    volumes:
      - auth-uploads:/app/uploads
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  event-service:
    build: ./event-service
    container_name: event-service
    mem_limit: 320m
    cpus: 1.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/eventdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-bXktc3VwZXItc2VjcmV0LWtleS1mb3ItZXZlbnQtcGxhdGZvcm0tMjAyNQ==}
    # No host port: reached via the gateway on the internal docker network.
    depends_on:
      event-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-guest}
      MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      MAIL_PORT: ${SMTP_PORT:-587}
      MAIL_USERNAME: ${SMTP_USER:-}
      MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@eventplatform.com}
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-false}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    mem_limit: 256m
    cpus: 0.75
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      EVENT_SERVICE_URL: http://event-service:8081
    # No host port: frontend nginx proxies /api to it on the internal network.
    depends_on:
      - auth-service
      - event-service

  frontend:
    build: ./frontend
    container_name: frontend
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - default
      - remnawave-network
    depends_on:
      - api-gateway

volumes:
  auth-db-data:
  event-db-data:
  auth-uploads:

networks:
  default:
  remnawave-network:
    external: true
