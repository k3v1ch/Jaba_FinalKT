server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA shell and its code/styles change on every deploy. Without an explicit
    # Cache-Control, browsers apply heuristic caching and keep running stale JS after
    # an update. "no-cache" still caches but forces revalidation (ETag → 304 when
    # unchanged), so a redeploy is picked up immediately without a hard refresh.
    location = /index.html  { add_header Cache-Control "no-cache"; }
    location = /app.js      { add_header Cache-Control "no-cache"; }
    location = /tailwind.css { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
